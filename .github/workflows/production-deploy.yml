name: FullWorth Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character master commit SHA to deploy"
        required: true
        type: string
      confirm_guarded_deploy:
        description: "I approve deploying this exact master release through the guarded production script"
        required: true
        default: false
        type: boolean

concurrency:
  group: billwatch-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  deploy:
    name: Guarded production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out requested release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify exact master release approval
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOY_CONFIRMED: ${{ inputs.confirm_guarded_deploy }}
        run: |
          set -euo pipefail

          release="$REQUESTED_RELEASE_SHA"

          if [[ "$DEPLOY_CONFIRMED" != "true" ]]; then
            echo "Guarded production deployment requires explicit confirmation." >&2
            exit 77
          fi

          if [[ ! "$release" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be one lowercase 40-character Git commit." >&2
            exit 64
          fi

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Production deployment may only be dispatched from master." >&2
            exit 65
          fi

          if [[ "$GITHUB_SHA" != "$release" ]]; then
            echo "The requested release does not match the checked-out workflow commit." >&2
            exit 65
          fi

          git fetch --no-tags origin master

          if [[ "$(git rev-parse origin/master)" != "$release" ]]; then
            echo "master advanced after this deployment was dispatched; refusing stale release." >&2
            exit 65
          fi

          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "GitHub runner checkout is not clean." >&2
            exit 65
          fi

          echo "release_sha=$release" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact release image artifacts
        id: release_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          artifact_name="fullworth-production-image-artifacts-$RELEASE_SHA"
          run_id="$(
            gh api \
              --method GET \
              -f branch=master \
              -f event=push \
              -f head_sha="$RELEASE_SHA" \
              -f status=success \
              -f per_page=100 \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA and .conclusion == "success")) | first | .id // empty'
          )"

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful FullWorth CI run exists for the exact approved master release." >&2
            exit 65
          fi

          mkdir -p release-artifacts
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir release-artifacts

          expected_files=(
            billwatch-api.tar
            billwatch-api.spdx.json
            billwatch-parser-worker.tar
            billwatch-parser-worker.spdx.json
            billwatch-web.tar
            billwatch-web.spdx.json
          )

          actual_count="$(find release-artifacts -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$actual_count" == "${#expected_files[@]}" ]] || {
            echo "The release artifact contains an unexpected file set." >&2
            exit 65
          }

          if find release-artifacts -mindepth 1 -maxdepth 1 -type l | grep -q .; then
            echo "The release artifact contains a symbolic link." >&2
            exit 65
          fi

          for file in "${expected_files[@]}"; do
            [[ -f "release-artifacts/$file" && ! -L "release-artifacts/$file" ]] || {
              echo "Required release artifact is missing or unsafe: $file" >&2
              exit 65
            }
          done

          for image in billwatch-api billwatch-parser-worker billwatch-web; do
            gh attestation verify "release-artifacts/$image.tar" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "release-artifacts/$image.tar" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document
          done

          (
            cd release-artifacts
            sha256sum "${expected_files[@]}" > SHA256SUMS
          )
          tar -C release-artifacts -cf release-images.tar .
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Configure pinned production SSH transport
        shell: bash
        env:
          SSH_HOST: ${{ secrets.FULLWORTH_PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.FULLWORTH_PRODUCTION_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.FULLWORTH_PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FULLWORTH_PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.FULLWORTH_PRODUCTION_SSH_PORT }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$SSH_HOST" || ! "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "FULLWORTH_PRODUCTION_SSH_HOST is missing or invalid." >&2
            exit 64
          fi

          if [[ -z "$SSH_USER" || ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "FULLWORTH_PRODUCTION_SSH_USER is missing or invalid." >&2
            exit 64
          fi

          port="${SSH_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]] || (( port < 1 || port > 65535 )); then
            echo "FULLWORTH_PRODUCTION_SSH_PORT must be a valid TCP port when supplied." >&2
            exit 64
          fi

          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "FULLWORTH_PRODUCTION_SSH_PRIVATE_KEY is required." >&2
            exit 64
          fi

          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "FULLWORTH_PRODUCTION_SSH_KNOWN_HOSTS is required for pinned host verification." >&2
            exit 64
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/fullworth-production"
          chmod 600 "$HOME/.ssh/fullworth-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host fullworth-production
            HostName $SSH_HOST
            User $SSH_USER
            Port $port
            IdentityFile $HOME/.ssh/fullworth-production
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ForwardAgent no
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy exact master release on production host
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          remote_bundle=".fullworth-release-$RELEASE_SHA.tar"
          scp -q release-images.tar "fullworth-production:$remote_bundle"

          ssh fullworth-production sh -s -- "$RELEASE_SHA" "$remote_bundle" <<'REMOTE'
          set -eu

          release=$1
          remote_bundle=$2
          root=/opt/billwatch
          artifact_dir=
          bundle="$HOME/$remote_bundle"

          cleanup_release_artifacts()
          {
              status=$?
              trap - EXIT HUP INT TERM
              [ -z "$artifact_dir" ] || rm -rf "$artifact_dir"
              rm -f "$bundle"
              exit "$status"
          }

          trap cleanup_release_artifacts EXIT HUP INT TERM

          case "$release" in
              *[!0-9a-f]*|'')
                  printf '%s\n' "Remote deployment refused: invalid release SHA." >&2
                  exit 64
                  ;;
          esac

          [ "${#release}" -eq 40 ] || {
              printf '%s\n' "Remote deployment refused: invalid release SHA length." >&2
              exit 64
          }

          [ -d "$root/.git" ] || {
              printf '%s\n' "Remote deployment refused: /opt/billwatch is not a Git checkout." >&2
              exit 66
          }

          cd "$root"

          [ "$(git branch --show-current)" = master ] || {
              printf '%s\n' "Remote deployment refused: production checkout is not on master." >&2
              exit 65
          }

          [ -z "$(git status --porcelain --untracked-files=normal)" ] || {
              printf '%s\n' "Remote deployment refused: production checkout is not clean." >&2
              exit 65
          }

          git fetch --no-tags origin master

          [ "$(git rev-parse origin/master)" = "$release" ] || {
              printf '%s\n' "Remote deployment refused: origin/master does not match the approved release." >&2
              exit 65
          }

          git merge --ff-only "$release"

          [ "$(git rev-parse HEAD)" = "$release" ] || {
              printf '%s\n' "Remote deployment refused: checkout did not reach the approved release." >&2
              exit 65
          }

          [ -f .env.production ] && [ ! -L .env.production ] || {
              printf '%s\n' "Remote deployment refused: protected .env.production is missing or unsafe." >&2
              exit 66
          }

          sed -i "s/^BILLWATCH_RELEASE_ID=.*/BILLWATCH_RELEASE_ID=$release/" .env.production

          [ -f "$bundle" ] && [ ! -L "$bundle" ] || {
              printf '%s\n' "Remote deployment refused: verified release image bundle is missing or unsafe." >&2
              exit 66
          }

          artifact_dir="$(mktemp -d)"
          tar -xf "$bundle" -C "$artifact_dir"

          [ -f "$artifact_dir/SHA256SUMS" ] &&
          [ ! -L "$artifact_dir/SHA256SUMS" ] || {
              printf '%s\n' "Remote deployment refused: release image checksums are missing or unsafe." >&2
              exit 66
          }

          (
              cd "$artifact_dir"
              sha256sum -c SHA256SUMS
          )

          for image_name in billwatch-api billwatch-parser-worker billwatch-web
          do
              image_archive="$artifact_dir/$image_name.tar"
              image_sbom="$artifact_dir/$image_name.spdx.json"

              [ -f "$image_archive" ] && [ ! -L "$image_archive" ] &&
              [ -f "$image_sbom" ] && [ ! -L "$image_sbom" ] || {
                  printf '%s\n' "Remote deployment refused: verified release image material is incomplete." >&2
                  exit 66
              }

              docker load --input "$image_archive" >/dev/null
          done

          sh deploy/validate-production-env.sh .env.production
          FULLWORTH_USE_PREBUILT_RELEASE_IMAGES=1 \
              sh deploy/deploy-production.sh .env.production
          sh deploy/verify-production.sh /opt/billwatch
          sh deploy/verify-beta-readiness.sh /opt/billwatch

          [ -f .billwatch-release ] && [ ! -L .billwatch-release ] || {
              printf '%s\n' "Remote deployment failed: verified release marker is missing or unsafe." >&2
              exit 66
          }

          [ "$(cat .billwatch-release)" = "$release" ] || {
              printf '%s\n' "Remote deployment failed: verified release marker does not match the approved release." >&2
              exit 65
          }

          printf '%s\n' "Guarded FullWorth production deployment verified for $release."
          REMOTE

      - name: Verify public readiness from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sh deploy/monitor-readiness.sh https://api.fullworth.org
          sh deploy/monitor-readiness.sh https://fullworth.org

      - name: Record metadata-only deployment summary
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          {
            echo "## FullWorth guarded production deployment"
            echo
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- API readiness: verified from GitHub runner"
            echo "- Web readiness: verified from GitHub runner"
            echo "- Server-side production and beta-readiness verifiers: passed"
            echo "- Release image CI run: \`${{ steps.release_artifacts.outputs.ci_run_id }}\`"
            echo "- API/parser/Web images: downloaded, provenance/SBOM-attested, and runtime identity verified"
            echo
            echo "Installed-device, Plaid provider observation, backup immutability, and qualified legal-review gates remain separate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
