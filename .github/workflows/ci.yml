name: FullWorth CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: billwatch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache backend NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-backend-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-backend-

      - name: Restore tests and dependencies
        run: dotnet restore FullWorth.Tests/FullWorth.Tests.csproj -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build backend
        run: dotnet build FullWorth.Tests/FullWorth.Tests.csproj --configuration Release --no-restore

      - name: Install EF migration verifier
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Verify committed migrations match the model
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__BillWatchDatabase: Host=localhost;Database=billwatch_ci_model_check;Username=billwatch;Password=ci-model-check-only
          Plaid__Environment: sandbox
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project FullWorth.API/FullWorth.API.csproj
          --startup-project FullWorth.API/FullWorth.API.csproj
          --no-build
          --configuration Release

      - name: Run tests
        run: dotnet test FullWorth.Tests/FullWorth.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify transaction stream regression
        run: node --test FullWorth.Tests/transaction-stream.test.mjs

  maui:
    name: MAUI Android build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect MAUI-relevant changes
        id: maui_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $safePrefixes = @(
            "FullWorth.API/",
            "FullWorth.Web/",
            "FullWorth.Tests/",
            "deploy/"
          )

          $safeExactFiles = @(
            ".dockerignore",
            ".env.production.example",
            "AI_SHADOW_CORPUS.md",
            "BILLWATCH_CONTEXT.md",
            "BILLWATCH_TODO.md",
            "Dockerfile",
            "Dockerfile.web",
            "README.md",
            "REVENUE_READINESS.md",
            "compose.production.yml"
          )

          $requiresMaui = $false

          foreach ($file in $changedFiles) {
            $safe =
              $safeExactFiles -contains $file

            if (-not $safe) {
              foreach ($prefix in $safePrefixes) {
                if ($file.StartsWith(
                    $prefix,
                    [System.StringComparison]::Ordinal)) {
                  $safe = $true
                  break
                }
              }
            }

            if (-not $safe) {
              $requiresMaui = $true
              break
            }
          }

          "required=$($requiresMaui.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10
        if: steps.maui_changes.outputs.required == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache MAUI NuGet packages
        if: steps.maui_changes.outputs.required == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-maui-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-maui-

      - name: Install MAUI workload
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore MAUI Android dependencies
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet restore FullWorth.csproj -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build MAUI Android
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet build FullWorth.csproj --framework net10.0-android --configuration Release --no-restore -p:FullWorthApiBaseUrl=https://api.billbeacon.net/

  container:
    name: Linux production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACME_EMAIL: ci@example.com
      BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY: "true"
      BILLWATCH_BACKUP_WORK_SIZE: 1g
      BILLWATCH_BACKUP_CLIENT_MODE: append-only
      BILLWATCH_DATABASE_PASSWORD: ci-only-password
      BILLWATCH_HOST: localhost
      BILLWATCH_WEB_HOST: web.localhost
      BILLWATCH_RELEASE_ID: ${{ github.sha }}
      BILLWATCH_REQUIRE_RECOVERY_FIXTURE: "true"
      PLAID_CLIENT_ID: ci-client
      PLAID_ENVIRONMENT: sandbox
      PLAID_SECRET: ci-secret
      RESTIC_PASSWORD: ci-restic-password-32-characters
      RESTIC_REPOSITORY: /repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect production-container-relevant changes
        id: container_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $relevantPrefixes = @(
            "FullWorth.API/",
            "FullWorth.Core/",
            "FullWorth.Web/",
            "deploy/"
          )

          $relevantExactFiles = @(
            ".github/workflows/ci.yml",
            ".dockerignore",
            ".env.production.example",
            "Dockerfile",
            "Dockerfile.web",
            "compose.production.yml"
          )

          $required = $false

          foreach ($file in $changedFiles) {
            if ($relevantExactFiles -contains $file) {
              $required = $true
              break
            }

            foreach ($prefix in $relevantPrefixes) {
              if ($file.StartsWith(
                  $prefix,
                  [System.StringComparison]::Ordinal)) {
                $required = $true
                break
              }
            }

            if ($required) {
              break
            }
          }

          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate production operation scripts
        if: steps.container_changes.outputs.required == 'true'
        run: |
          sh deploy/tests/production-operations-tests.sh
          sh deploy/tests/operations-alert-sender-tests.sh
          sh deploy/tests/backup-trust-boundary-tests.sh
          sh deploy/tests/release-integrity-tests.sh
          sh deploy/tests/runtime-release-tests.sh
          sh deploy/tests/http-security-boundary-tests.sh
          sh deploy/tests/runtime-watchdog-tests.sh

      - name: Validate beta readiness scripts
        if: steps.container_changes.outputs.required == 'true'
        run: |
          sh deploy/tests/beta-readiness-tests.sh
          sh deploy/tests/web-bff-cross-user-smoke-tests.sh
          sh deploy/tests/reboot-recovery-drill-tests.sh
          sh deploy/tests/admin-api-smoke-tests.sh
          sh deploy/tests/authenticated-api-smoke-tests.sh
          sh deploy/tests/internal-beta0-tests.sh
          sh deploy/tests/subscription-rollout-preflight-tests.sh

      - name: Configure container builder
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build production API image
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: billwatch-api:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build production web image
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          load: true
          push: false
          tags: billwatch-web:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start production stack
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --file compose.production.yml up --detach --no-build

      - name: Verify API HTTPS readiness
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Verify web HTTPS readiness
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 --resolve web.localhost:443:127.0.0.1 https://web.localhost/health/ready

      - name: Verify production HTTP security boundaries
        if: steps.container_changes.outputs.required == 'true'
        env:
          BILLWATCH_HTTP_SECURITY_ALLOW_INSECURE: "true"
        run: >-
          sh deploy/check-http-security-boundaries.sh
          https://localhost
          https://web.localhost

      - name: Seed protected recovery fixture
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          email="ci-recovery-${GITHUB_RUN_ID}@billwatch.local"
          password='BillWatch!CiRecovery123'
          curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/register \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\",\"acceptedTermsAndPrivacy\":true,\"legalTermsVersion\":\"2026-09-04-beta\"}" \
            >/dev/null
          login_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/login \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\"}")"
          access_token="$(jq --exit-status --raw-output '.accessToken' <<<"${login_json}")"
          stream_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/bill-streams \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data '{"providerName":"CI Recovery Provider","category":"Utility"}')"
          stream_id="$(jq --exit-status --raw-output '.id' <<<"${stream_json}")"
          printf '%%PDF-1.4\n%% CI recovery fixture\n%%%%EOF\n' > /tmp/billwatch-recovery-fixture.pdf
          curl --fail --silent --show-error --insecure \
            --request POST "https://localhost/api/bill-streams/${stream_id}/statement-uploads" \
            --header "Authorization: Bearer ${access_token}" \
            --form 'file=@/tmp/billwatch-recovery-fixture.pdf;type=application/pdf' \
            >/dev/null
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/keys -type f -name "key-*.xml" -size +0c -print -quit)"'
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/statements -type f -size +0c -print -quit)"'

      - name: Build recovery image
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml build backup

      - name: Verify production image release revisions
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            "billwatch-api:${BILLWATCH_RELEASE_ID}" \
            "billwatch-web:${BILLWATCH_RELEASE_ID}" \
            "billwatch-backup:${BILLWATCH_RELEASE_ID}"
          do
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}")"
            test "${revision}" = "${BILLWATCH_RELEASE_ID}"
          done

      - name: Initialize encrypted backup repository
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml run --rm backup init

      - name: Create consistent encrypted backup
        if: steps.container_changes.outputs.required == 'true'
        run: sh deploy/run-backup.sh "$PWD"

      - name: Prove isolated database and file restore
        if: steps.container_changes.outputs.required == 'true'
        run: |
          docker compose --profile operations --file compose.production.yml up --detach --wait restore-database
          docker compose --profile operations --file compose.production.yml run --rm backup verify
          docker compose --profile operations --file compose.production.yml stop restore-database

      - name: Verify API recovery after backup
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Print sanitized container logs on failure
        if: failure() && steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml logs --no-color --tail 200

      - name: Stop production stack
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml down --volumes
