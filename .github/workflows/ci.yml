name: FullWorth CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: billwatch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify production images are digest pinned
        run: bash deploy/tests/container-image-pinning-tests.sh

      - name: Detect backend-relevant changes
        id: backend_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $backendSafeExactFiles = @(
            "AI_SHADOW_CORPUS.md",
            "ARCHITECTURE.md",
            "BILLWATCH_CONTEXT.md",
            "FULLWORTH_CONTEXT.md",
            "README.md",
            "REVENUE_READINESS.md"
          )

          $backendSafePrefixes = @(
            "FullWorth.VisualTests/"
          )

          $required = $false

          foreach ($file in $changedFiles) {
            $safe = $backendSafeExactFiles -contains $file

            if (-not $safe) {
              foreach ($prefix in $backendSafePrefixes) {
                if ($file.StartsWith(
                    $prefix,
                    [System.StringComparison]::Ordinal)) {
                  $safe = $true
                  break
                }
              }
            }

            if (-not $safe) {
              $required = $true
              break
            }
          }

          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10
        if: steps.backend_changes.outputs.required == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache backend NuGet packages
        if: steps.backend_changes.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-backend-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-backend-

      - name: Restore tests and dependencies
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet restore FullWorth.Tests/FullWorth.Tests.csproj -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Restore offline AI evaluation runner
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet restore FullWorth.AiEvaluation/FullWorth.AiEvaluation.csproj -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build backend
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet build FullWorth.Tests/FullWorth.Tests.csproj --configuration Release --no-restore
      - name: Build offline AI evaluation runner
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet build FullWorth.AiEvaluation/FullWorth.AiEvaluation.csproj --configuration Release --no-restore

      - name: Install EF migration verifier
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Verify committed migrations match the model
        if: steps.backend_changes.outputs.required == 'true'
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__BillWatchDatabase: Host=localhost;Database=billwatch_ci_model_check;Username=billwatch;Password=ci-model-check-only
          Plaid__Environment: sandbox
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project FullWorth.API/FullWorth.API.csproj
          --startup-project FullWorth.API/FullWorth.API.csproj
          --no-build
          --configuration Release

      - name: Run tests
        if: steps.backend_changes.outputs.required == 'true'
        run: dotnet test FullWorth.Tests/FullWorth.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify transaction stream regression
        if: steps.backend_changes.outputs.required == 'true'
        run: node --test FullWorth.Tests/transaction-stream.test.mjs

  maui:
    name: MAUI Android build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect MAUI-relevant changes
        id: maui_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $safePrefixes = @(
            "FullWorth.API/",
            "FullWorth.AiEvaluation/",
            "FullWorth.Web/",
            "FullWorth.Tests/",
            "FullWorth.VisualTests/",
            "deploy/"
          )

          $safeExactFiles = @(
            ".github/workflows/branch-cleanup.yml",
            ".github/workflows/repository-governance.yml",
            ".dockerignore",
            ".env.ai.example",
            ".env.production.example",
            "AI_SHADOW_CORPUS.md",
            "ARCHITECTURE.md",
            "BILLWATCH_CONTEXT.md",
            "FULLWORTH_CONTEXT.md",
            "FULLWORTH_ROADMAP.md",
            "IOS_INTERNAL_TESTING.md",
            "Dockerfile",
            "Dockerfile.web",
            "README.md",
            "REVENUE_READINESS.md",
            "compose.ai-evaluation.yml",
            "compose.production.yml"
          )

          $requiresMaui = $false

          foreach ($file in $changedFiles) {
            $safe =
              $safeExactFiles -contains $file

            if (-not $safe) {
              foreach ($prefix in $safePrefixes) {
                if ($file.StartsWith(
                    $prefix,
                    [System.StringComparison]::Ordinal)) {
                  $safe = $true
                  break
                }
              }
            }

            if (-not $safe) {
              $requiresMaui = $true
              break
            }
          }

          "required=$($requiresMaui.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10
        if: steps.maui_changes.outputs.required == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache MAUI NuGet packages
        if: steps.maui_changes.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-maui-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-maui-

      - name: Install MAUI workload
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore MAUI Android dependencies
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet restore FullWorth.csproj -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build MAUI Android
        if: steps.maui_changes.outputs.required == 'true'
        run: dotnet build FullWorth.csproj --framework net10.0-android --configuration Release --no-restore -p:FullWorthApiBaseUrl=https://api.billbeacon.net/

  container:
    name: Linux production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACME_EMAIL: ci@example.com
      BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY: "true"
      BILLWATCH_BACKUP_WORK_SIZE: 1g
      BILLWATCH_BACKUP_CLIENT_MODE: append-only
      BILLWATCH_DATABASE_PASSWORD: ci-only-password
      BILLWATCH_PARSER_AUTH_TOKEN: ci-parser-worker-authentication-token-more-than-32-characters
      BILLWATCH_WEB_SESSION_REDIS_PASSWORD: ci-web-session-password-more-than-32-characters
      BILLWATCH_HOST: localhost
      BILLWATCH_WEB_HOST: web.localhost
      BILLWATCH_RELEASE_ID: ${{ github.sha }}
      BILLWATCH_REQUIRE_RECOVERY_FIXTURE: "true"
      PLAID_CLIENT_ID: ci-client
      PLAID_ENVIRONMENT: sandbox
      PLAID_SECRET: ci-secret
      RESTIC_PASSWORD: ci-restic-password-32-characters
      RESTIC_REPOSITORY: /repository

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect production-container-relevant changes
        id: container_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $relevantPrefixes = @(
            "FullWorth.API/",
            "FullWorth.ParserWorker/",
            "FullWorth.Core/",
            "FullWorth.Web/",
            "FullWorth.VisualTests/",
            "deploy/",
            ".github/workflows/"
          )

          $relevantExactFiles = @(
            ".github/workflows/ci.yml",
            ".github/workflows/android-internal-apk.yml",
            ".github/workflows/production-deploy.yml",
            ".github/workflows/branch-cleanup.yml",
            ".github/workflows/repository-governance.yml",
            ".dockerignore",
            ".env.production.example",
            ".env.ai.example",
            "Dockerfile",
            "Dockerfile.web",
            "compose.production.yml",
            "compose.ai-evaluation.yml"
          )

          $required = $false

          foreach ($file in $changedFiles) {
            if ($relevantExactFiles -contains $file) {
              $required = $true
              break
            }

            foreach ($prefix in $relevantPrefixes) {
              if ($file.StartsWith(
                  $prefix,
                  [System.StringComparison]::Ordinal)) {
                $required = $true
                break
              }
            }

            if ($required) {
              break
            }
          }

          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Detect visual-acceptance changes
        id: visual_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "required=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")

          $required = $false

          foreach ($file in $changedFiles) {
            if ($file.StartsWith(
                    "FullWorth.Web/",
                    [System.StringComparison]::Ordinal) -or
                $file.StartsWith(
                    "FullWorth.VisualTests/",
                    [System.StringComparison]::Ordinal) -or
                [string]::Equals(
                    $file,
                    ".github/workflows/ci.yml",
                    [System.StringComparison]::Ordinal)) {
              $required = $true
              break
            }
          }

          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate production operation scripts
        if: steps.container_changes.outputs.required == 'true'
        run: |
          sh deploy/tests/workflow-action-pinning-tests.sh
          sh deploy/tests/project-boundary-tests.sh
          sh deploy/tests/service-module-boundary-tests.sh
          sh deploy/tests/data-ownership-boundary-tests.sh
          sh deploy/tests/controller-data-ownership-boundary-tests.sh
          sh deploy/tests/legacy-brand-compatibility-tests.sh
          sh deploy/tests/android-internal-apk-workflow-tests.sh
          sh deploy/tests/branch-cleanup-workflow-tests.sh
          sh deploy/tests/ci-maui-change-detection-tests.sh
          sh deploy/tests/ci-production-container-change-detection-tests.sh
          sh deploy/tests/repository-governance-workflow-tests.sh
          sh deploy/tests/production-deploy-workflow-tests.sh
          sh deploy/tests/production-operations-tests.sh
          sh deploy/tests/operations-alert-sender-tests.sh
          sh deploy/tests/backup-trust-boundary-tests.sh
          sh deploy/tests/release-integrity-tests.sh
          sh deploy/tests/runtime-release-tests.sh
          sh deploy/tests/http-security-boundary-tests.sh
          sh deploy/tests/runtime-watchdog-tests.sh
          sh deploy/tests/production-auth-smoke-workflow-tests.sh

      - name: Validate beta readiness scripts
        if: steps.container_changes.outputs.required == 'true'
        run: |
          sh deploy/tests/beta-readiness-tests.sh
          sh deploy/tests/web-bff-cross-user-smoke-tests.sh
          sh deploy/tests/reboot-recovery-drill-tests.sh
          sh deploy/tests/admin-api-smoke-tests.sh
          sh deploy/tests/authenticated-api-smoke-tests.sh
          sh deploy/tests/internal-beta0-tests.sh
          sh deploy/tests/subscription-rollout-preflight-tests.sh

      - name: Validate local AI evaluation runtime
        if: steps.container_changes.outputs.required == 'true'
        run: |
          sh -n deploy/validate-ai-evaluation-env.sh
          sh -n deploy/verify-approved-ai-model.sh
          sh -n deploy/check-ai-evaluation-runtime.sh
          sh -n deploy/start-ai-evaluation.sh

          model_file="$(mktemp)"
          env_file="$(mktemp)"
          server_pid=""

          cleanup_ai_runtime_test()
          {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi

            rm -f "$model_file" "$env_file"
          }

          trap cleanup_ai_runtime_test EXIT

          printf '%s' 'fullworth-ci-model-fixture' > "$model_file"
          model_sha="$(sha256sum "$model_file" | awk '{ print $1 }')"
          chmod 600 "$env_file"

          cat > "$env_file" <<EOF
          FULLWORTH_LOCAL_AI_IMAGE=ghcr.io/ggml-org/llama.cpp:server-b11176@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
          FULLWORTH_LOCAL_AI_MODEL_PATH=$model_file
          FULLWORTH_LOCAL_AI_MODEL_SHA256=$model_sha
          FULLWORTH_LOCAL_AI_API_KEY=ci-local-ai-key-32-characters-minimum
          FULLWORTH_LOCAL_AI_MODEL_ALIAS=fullworth-local
          FULLWORTH_LOCAL_AI_CONTEXT_SIZE=8192
          FULLWORTH_LOCAL_AI_MAX_PREDICT=4096
          FULLWORTH_LOCAL_AI_THREADS=4
          FULLWORTH_LOCAL_AI_GPU_LAYERS=0
          EOF

          sh deploy/validate-ai-evaluation-env.sh "$env_file"

          cat > "$env_file" <<EOF
          FULLWORTH_LOCAL_AI_IMAGE=ghcr.io/ggml-org/llama.cpp:server-b11176@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
          FULLWORTH_LOCAL_AI_MODEL_PATH=$model_file
          FULLWORTH_LOCAL_AI_MODEL_SHA256=7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          FULLWORTH_LOCAL_AI_API_KEY=ci-local-ai-key-32-characters-minimum
          FULLWORTH_LOCAL_AI_MODEL_ALIAS=fullworth-local
          FULLWORTH_LOCAL_AI_CONTEXT_SIZE=8192
          FULLWORTH_LOCAL_AI_MAX_PREDICT=4096
          FULLWORTH_LOCAL_AI_THREADS=4
          FULLWORTH_LOCAL_AI_GPU_LAYERS=0
          EOF

          sh deploy/verify-approved-ai-model.sh metadata-only "$env_file"

          if sh deploy/verify-approved-ai-model.sh full "$env_file"; then
            printf '%s\n' "Approved-model verifier accepted an unapproved file." >&2
            exit 1
          fi

          FULLWORTH_LOCAL_AI_IMAGE=ghcr.io/ggml-org/llama.cpp:server-b11176@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af \
          FULLWORTH_LOCAL_AI_API_KEY=ci-local-ai-key-32-characters-minimum \
          FULLWORTH_LOCAL_AI_MODEL_PATH="$model_file" \
          docker compose --file compose.ai-evaluation.yml config >/dev/null

          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          EXPECTED_AUTH = "Bearer ci-local-ai-key-32-characters-minimum"

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self.send_json(200, {"status": "ok"})
                      return

                  self.send_json(404, {"error": "not_found"})

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  raw_body = self.rfile.read(length) if length else b""

                  if self.path != "/v1/chat/completions":
                      self.send_json(404, {"error": "not_found"})
                      return

                  if self.headers.get("Authorization") != EXPECTED_AUTH:
                      self.send_json(401, {"error": "unauthorized"})
                      return

                  try:
                      request = json.loads(raw_body)
                      response_format = request["response_format"]
                      schema = response_format["json_schema"]
                      schema_body = schema["schema"]
                      valid_schema = (
                          response_format["type"] == "json_schema"
                          and schema["name"] == "fullworth_runtime_smoke"
                          and schema["strict"] is True
                          and schema_body["type"] == "object"
                          and schema_body["properties"] == {
                              "ok": {"type": "boolean"}
                          }
                          and schema_body["required"] == ["ok"]
                          and schema_body["additionalProperties"] is False
                      )
                  except (ValueError, KeyError, TypeError):
                      valid_schema = False

                  if not valid_schema:
                      self.send_json(400, {"error": "invalid_schema"})
                      return

                  self.send_json(
                      200,
                      {
                          "choices": [
                              {
                                  "finish_reason": "stop",
                                  "message": {
                                      "role": "assistant",
                                      "content": json.dumps(
                                          {"ok": True},
                                          separators=(",", ":"),
                                      ),
                                  },
                              }
                          ]
                      },
                  )

          HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
          PY
          server_pid=$!

          sh deploy/check-ai-evaluation-runtime.sh "$env_file"

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          server_pid=""

      - name: Configure container builder
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build production API image
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: final
          load: true
          push: false
          tags: billwatch-api:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build production parser worker image
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: parser-worker-final
          load: true
          push: false
          tags: billwatch-parser-worker:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=parser-worker
          cache-to: type=gha,mode=max,scope=parser-worker

      - name: Build production web image
        if: steps.container_changes.outputs.required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.web
          load: true
          push: false
          tags: billwatch-web:${{ github.sha }}
          build-args: |
            BILLWATCH_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start production stack
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --file compose.production.yml up --detach --no-build

      - name: Verify parser cgroup delegation boundary
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose --file compose.production.yml ps -q parser-worker)"
          test -n "$container_id"
          parser_pid="$(docker inspect --format '{{.State.Pid}}' "$container_id")"
          test "$parser_pid" -gt 0

          parser_uid="$(awk '/^Uid:/ { print $2; exit }' "/proc/${parser_pid}/status")"
          parser_caps="$(awk '/^CapEff:/ { print $2; exit }' "/proc/${parser_pid}/status")"
          parser_bounding_caps="$(awk '/^CapBnd:/ { print $2; exit }' "/proc/${parser_pid}/status")"
          test "$parser_uid" = "1654"
          test "$parser_caps" = "0000000000000000"
          test "$parser_bounding_caps" = "0000000000000000"

          parser_relative="$(
            awk -F: '$1 == "0" && $2 == "" { print $3; exit }'               "/proc/${parser_pid}/cgroup"
          )"
          case "$parser_relative" in
            */fullworth-supervisor) ;;
            *)
              echo "Parser supervisor is not in its delegated leaf cgroup." >&2
              exit 1
              ;;
          esac

          parent_relative="${parser_relative%/fullworth-supervisor}"
          parent_cgroup="/sys/fs/cgroup${parent_relative}"
          test -d "$parent_cgroup"

          cpu_max="$(cat "$parent_cgroup/cpu.max")"
          memory_max="$(cat "$parent_cgroup/memory.max")"
          swap_max="$(cat "$parent_cgroup/memory.swap.max")"
          pids_max="$(cat "$parent_cgroup/pids.max")"

          case "$cpu_max" in max\ *|"") exit 1 ;; esac
          case "$memory_max" in max|"") exit 1 ;; esac
          case "$swap_max" in max|"") exit 1 ;; esac
          case "$pids_max" in max|"") exit 1 ;; esac

          for controller in cpu memory pids
          do
            tr ' ' '\n' < "$parent_cgroup/cgroup.subtree_control" |
              grep -qx "$controller"
          done

          docker compose --file compose.production.yml exec -T api             curl --fail --silent --show-error               --retry 30 --retry-all-errors --retry-delay 1               --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem               https://parser-worker:8081/health/ready               >/dev/null

      - name: Prove parser per-document memory containment
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          evidence="$(
            docker compose --file compose.production.yml run               --rm               --no-deps               parser-worker               dotnet FullWorth.ParserWorker.dll --containment-self-test
          )"

          printf '%s' "$evidence" | python3 -c '
          import json
          import sys

          result = json.load(sys.stdin)
          assert result.get("status") == "ok", result
          assert result.get("code") == "ok", result
          assert result.get("memoryMaxBytes") == 402653184, result
          assert result.get("memoryPeakBytes", 0) > 0, result
          assert result.get("oomKillDelta", 0) >= 1, result
          '

          docker compose --file compose.production.yml ps --status running --services |
            grep -qx parser-worker

          docker compose --file compose.production.yml exec -T api             curl --fail --silent --show-error               --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem               https://parser-worker:8081/health/ready               >/dev/null

      - name: Verify API HTTPS readiness
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Verify web HTTPS readiness
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 --resolve web.localhost:443:127.0.0.1 https://web.localhost/health/ready

      - name: Verify isolated PDF parser request path
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          unauthorized_status="$(
            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --silent --output /dev/null --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/pdf' \
                --data-binary '' https://parser-worker:8081/v1/pdf/extract
          )"
          test "$unauthorized_status" = "401"

          wrong_credential_status="$(
            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --silent --output /dev/null --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/pdf' \
                --header 'Authorization: Bearer wrong-parser-worker-authentication-token' \
                --data-binary '' https://parser-worker:8081/v1/pdf/extract
          )"
          test "$wrong_credential_status" = "401"

          if docker compose --file compose.production.yml exec -T api \
              curl --fail --silent \
                http://parser-worker:8081/health/live
          then
            echo "Parser worker accepted plaintext HTTP." >&2
            exit 1
          fi

          pdf_file="$(mktemp)"
          trap 'rm -f "$pdf_file"' EXIT

          python3 - <<'PY' > "$pdf_file"
          import sys

          content = b"BT /F1 12 Tf 72 720 Td (FullWorth integration statement total due $92.17) Tj ET\n"
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
              b"<< /Length " + str(len(content)).encode() + b" >>\nstream\n" + content + b"endstream",
          ]

          pdf = bytearray(b"%PDF-1.4\n")
          offsets = [0]
          for index, body in enumerate(objects, start=1):
              offsets.append(len(pdf))
              pdf.extend(f"{index} 0 obj\n".encode() + body + b"\nendobj\n")

          xref = len(pdf)
          pdf.extend(f"xref\n0 {len(offsets)}\n".encode())
          pdf.extend(b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              pdf.extend(f"{offset:010d} 00000 n \n".encode())
          pdf.extend(
              f"trailer\n<< /Size {len(offsets)} /Root 1 0 R >>\n"
              f"startxref\n{xref}\n%%EOF\n".encode()
          )
          sys.stdout.buffer.write(pdf)
          PY

          timestamp="$(date +%s)"
          nonce="$(openssl rand -hex 16)"
          content_sha256="$(sha256sum "$pdf_file" | awk '{ print $1 }')"
          signature="$(
            printf 'POST\n/v1/pdf/extract\n%s\n%s\n%s' \
              "$timestamp" "$nonce" "$content_sha256" |
              openssl dgst -sha256 -hmac "$BILLWATCH_PARSER_AUTH_TOKEN" -hex |
              awk '{ print $2 }'
          )"

          response="$(
            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --fail --silent --show-error --request POST \
                --header 'Content-Type: application/pdf' \
                --header "Authorization: Bearer ${BILLWATCH_PARSER_AUTH_TOKEN}" \
                --header "X-FullWorth-Parser-Timestamp: ${timestamp}" \
                --header "X-FullWorth-Parser-Nonce: ${nonce}" \
                --header "X-FullWorth-Parser-Content-SHA256: ${content_sha256}" \
                --header "X-FullWorth-Parser-Signature: ${signature}" \
                --data-binary @- https://parser-worker:8081/v1/pdf/extract \
              < "$pdf_file"
          )"
          printf '%s' "$response" | python3 -c '
          import json
          import sys

          result = json.load(sys.stdin)
          assert result.get("protocolVersion") == 1, result
          assert result.get("outcome") == "text", result
          assert result.get("pageCount") == 1, result
          assert "total due $92.17" in result.get("text", ""), result
          '

          replay_status="$(
            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --silent --output /dev/null --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/pdf' \
                --header "Authorization: Bearer ${BILLWATCH_PARSER_AUTH_TOKEN}" \
                --header "X-FullWorth-Parser-Timestamp: ${timestamp}" \
                --header "X-FullWorth-Parser-Nonce: ${nonce}" \
                --header "X-FullWorth-Parser-Content-SHA256: ${content_sha256}" \
                --header "X-FullWorth-Parser-Signature: ${signature}" \
                --data-binary '' https://parser-worker:8081/v1/pdf/extract
          )"
          test "$replay_status" = "401"

          tampered_nonce="$(openssl rand -hex 16)"
          tampered_signature="$(
            printf 'POST\n/v1/pdf/extract\n%s\n%s\n%s' \
              "$timestamp" "$tampered_nonce" "$content_sha256" |
              openssl dgst -sha256 -hmac "$BILLWATCH_PARSER_AUTH_TOKEN" -hex |
              awk '{ print $2 }'
          )"
          tampered_body_status="$(
            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --silent --output /dev/null --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/pdf' \
                --header "Authorization: Bearer ${BILLWATCH_PARSER_AUTH_TOKEN}" \
                --header "X-FullWorth-Parser-Timestamp: ${timestamp}" \
                --header "X-FullWorth-Parser-Nonce: ${tampered_nonce}" \
                --header "X-FullWorth-Parser-Content-SHA256: ${content_sha256}" \
                --header "X-FullWorth-Parser-Signature: ${tampered_signature}" \
                --data-binary '' https://parser-worker:8081/v1/pdf/extract
          )"
          test "$tampered_body_status" = "401"

      - name: Verify isolated OCR worker path and per-document cgroup
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          image_file="$(mktemp)"
          response_one="$(mktemp)"
          response_two="$(mktemp)"
          trap 'rm -f "$image_file" "$response_one" "$response_two"' EXIT

          python3 - <<'PY' > "$image_file"
          import struct
          import zlib

          width = 2400
          height = 1800
          raw = b"".join(
              b"\\x00" + (b"\\xff\\xff\\xff" * width)
              for _ in range(height)
          )

          def chunk(kind, payload):
              body = kind + payload
              return (
                  struct.pack(">I", len(payload))
                  + body
                  + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              )

          png = (
              b"\\x89PNG\\r\\n\\x1a\\n"
              + chunk(
                  b"IHDR",
                  struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0),
              )
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )
          __import__("sys").stdout.buffer.write(png)
          PY

          content_sha256="$(sha256sum "$image_file" | awk '{ print $1 }')"

          container_id="$(docker compose --file compose.production.yml ps -q parser-worker)"
          test -n "$container_id"
          parser_pid="$(docker inspect --format '{{.State.Pid}}' "$container_id")"
          test "$parser_pid" -gt 0

          parser_relative="$(
            awk -F: '$1 == "0" && $2 == "" { print $3; exit }' \
              "/proc/${parser_pid}/cgroup"
          )"
          case "$parser_relative" in
            */fullworth-supervisor) ;;
            *)
              echo "Parser supervisor is not in its delegated leaf cgroup." >&2
              exit 1
              ;;
          esac

          parent_relative="${parser_relative%/fullworth-supervisor}"
          parent_cgroup="/sys/fs/cgroup${parent_relative}"
          test -d "$parent_cgroup"

          send_ocr_request()
          {
            output_file=$1
            timestamp="$(date +%s)"
            nonce="$(openssl rand -hex 16)"
            signature="$(
              printf 'POST\n/v1/ocr/extract\n%s\n%s\n%s' \
                "$timestamp" "$nonce" "$content_sha256" |
                openssl dgst -sha256 -hmac "$BILLWATCH_PARSER_AUTH_TOKEN" -hex |
                awk '{ print $2 }'
            )"

            docker compose --file compose.production.yml exec -T api \
              curl --cacert /var/run/fullworth-parser-tls/parser-worker.cer.pem \
                --fail --silent --show-error --request POST \
                --header 'Content-Type: image/png' \
                --header 'X-FullWorth-Ocr-Extension: .png' \
                --header "Authorization: Bearer ${BILLWATCH_PARSER_AUTH_TOKEN}" \
                --header "X-FullWorth-Parser-Timestamp: ${timestamp}" \
                --header "X-FullWorth-Parser-Nonce: ${nonce}" \
                --header "X-FullWorth-Parser-Content-SHA256: ${content_sha256}" \
                --header "X-FullWorth-Parser-Signature: ${signature}" \
                --data-binary @- https://parser-worker:8081/v1/ocr/extract \
              < "$image_file" > "$output_file"
          }

          observe_document_cgroup()
          {
            request_pid=$1
            for _ in $(seq 1 500)
            do
              matches=("$parent_cgroup"/fullworth-ocr-*)
              if [ "${#matches[@]}" -gt 1 ]; then
                echo "More than one OCR document cgroup exists under the single-request worker." >&2
                return 1
              fi

              if [ "${#matches[@]}" -eq 1 ]; then
                printf '%s\n' "${matches[0]}"
                return 0
              fi

              if ! kill -0 "$request_pid" 2>/dev/null; then
                break
              fi

              sleep 0.01
            done

            echo "No per-document OCR cgroup was observed while OCR was active." >&2
            return 1
          }

          verify_live_document_cgroup()
          {
            cgroup_path=$1
            test -d "$cgroup_path"
            test "$(cat "$cgroup_path/memory.max")" = "402653184"
            test "$(cat "$cgroup_path/memory.swap.max")" = "0"
            test "$(cat "$cgroup_path/pids.max")" = "48"
            test "$(tr -s '[:space:]' ' ' < "$cgroup_path/cpu.max" | sed 's/ $//')" = "100000 100000"

            child_pid="$(head -n 1 "$cgroup_path/cgroup.procs")"
            test -n "$child_pid"
            child_relative="$(
              awk -F: '$1 == "0" && $2 == "" { print $3; exit }' \
                "/proc/${child_pid}/cgroup"
            )"
            expected_relative="/${cgroup_path#/sys/fs/cgroup/}"
            test "$child_relative" = "$expected_relative"
          }

          verify_removed_document_cgroup()
          {
            cgroup_path=$1
            for _ in $(seq 1 200)
            do
              [ ! -d "$cgroup_path" ] && return 0
              sleep 0.01
            done

            echo "Per-document cgroup remained after its OCR child exited." >&2
            return 1
          }

          existing=("$parent_cgroup"/fullworth-ocr-*)
          test "${#existing[@]}" -eq 0

          send_ocr_request "$response_one" &
          first_request_pid=$!
          first_cgroup="$(observe_document_cgroup "$first_request_pid")"
          verify_live_document_cgroup "$first_cgroup"
          wait "$first_request_pid"
          verify_removed_document_cgroup "$first_cgroup"

          send_ocr_request "$response_two" &
          second_request_pid=$!
          second_cgroup="$(observe_document_cgroup "$second_request_pid")"
          verify_live_document_cgroup "$second_cgroup"
          wait "$second_request_pid"
          verify_removed_document_cgroup "$second_cgroup"

          test "$first_cgroup" != "$second_cgroup"

          for response_file in "$response_one" "$response_two"
          do
            python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)

          assert result.get("pageCount") == 1, result
          assert result.get("isUsable") is False, result
          assert result.get("text") == "", result
          PY
          done

      - name: Install visual acceptance dependencies
        if: steps.visual_changes.outputs.required == 'true'
        run: npm --prefix FullWorth.VisualTests install --no-audit --no-fund

      - name: Install Chromium for visual acceptance
        if: steps.visual_changes.outputs.required == 'true'
        run: npm --prefix FullWorth.VisualTests exec playwright install --with-deps chromium

      - name: Capture visual acceptance screenshots
        if: steps.visual_changes.outputs.required == 'true'
        env:
          FULLWORTH_VISUAL_BASE_URL: https://web.localhost
        run: node FullWorth.VisualTests/visual-acceptance.mjs

      - name: Upload visual acceptance screenshots
        if: always() && steps.visual_changes.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fullworth-visual-${{ github.run_id }}
          path: FullWorth.VisualTests/artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Verify production HTTP security boundaries
        if: steps.container_changes.outputs.required == 'true'
        env:
          BILLWATCH_HTTP_SECURITY_ALLOW_INSECURE: "true"
        run: >-
          sh deploy/check-http-security-boundaries.sh
          https://localhost
          https://web.localhost

      - name: Seed protected recovery fixture
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          email="ci-recovery-${GITHUB_RUN_ID}@fullworth.local"
          password='FullWorth!CiRecovery123'
          curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/register \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\",\"acceptedTermsAndPrivacy\":true,\"legalTermsVersion\":\"2026-09-04-beta\"}" \
            >/dev/null
          login_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/auth/login \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\"}")"
          access_token="$(jq --exit-status --raw-output '.accessToken' <<<"${login_json}")"
          refresh_token="$(jq --exit-status --raw-output '.refreshToken' <<<"${login_json}")"

          umask 077
          refresh_race_dir="$(mktemp -d)"
          cleanup_refresh_race() {
            rm -rf "${refresh_race_dir}"
          }
          trap cleanup_refresh_race EXIT

          # First-use race: exactly one request may establish the refresh family.
          printf '{"refreshToken":"%s"}' "${refresh_token}" |
            curl --silent --show-error --insecure \
              --output "${refresh_race_dir}/first-a.body" \
              --write-out '%{http_code}' \
              --request POST https://localhost/api/auth/refresh \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              >"${refresh_race_dir}/first-a.code" &
          first_a_pid=$!

          printf '{"refreshToken":"%s"}' "${refresh_token}" |
            curl --silent --show-error --insecure \
              --output "${refresh_race_dir}/first-b.body" \
              --write-out '%{http_code}' \
              --request POST https://localhost/api/auth/refresh \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              >"${refresh_race_dir}/first-b.code" &
          first_b_pid=$!

          wait "${first_a_pid}"
          wait "${first_b_pid}"

          first_a_code="$(cat "${refresh_race_dir}/first-a.code")"
          first_b_code="$(cat "${refresh_race_dir}/first-b.code")"

          first_successes=0
          first_replays=0
          for code in "${first_a_code}" "${first_b_code}"; do
            case "${code}" in
              200) first_successes=$((first_successes + 1)) ;;
              401) first_replays=$((first_replays + 1)) ;;
              *) echo "Unexpected first refresh race status: ${code}" >&2; exit 1 ;;
            esac
          done
          test "${first_successes}" -eq 1
          test "${first_replays}" -eq 1

          if [ "${first_a_code}" = "200" ]; then
            first_refresh_json="$(cat "${refresh_race_dir}/first-a.body")"
          else
            first_refresh_json="$(cat "${refresh_race_dir}/first-b.body")"
          fi

          first_rotated_refresh_token="$(jq --exit-status --raw-output '.refreshToken' <<<"${first_refresh_json}")"

          replay_original_code="$(
            printf '{"refreshToken":"%s"}' "${refresh_token}" |
              curl --silent --show-error --insecure \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST https://localhost/api/auth/refresh \
                --header 'Content-Type: application/json' \
                --data-binary @-
          )"
          test "${replay_original_code}" = "401"

          # Family-advance race: the PostgreSQL compare-and-swap must again
          # admit exactly one copy of the same rotated token.
          printf '{"refreshToken":"%s"}' "${first_rotated_refresh_token}" |
            curl --silent --show-error --insecure \
              --output "${refresh_race_dir}/second-a.body" \
              --write-out '%{http_code}' \
              --request POST https://localhost/api/auth/refresh \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              >"${refresh_race_dir}/second-a.code" &
          second_a_pid=$!

          printf '{"refreshToken":"%s"}' "${first_rotated_refresh_token}" |
            curl --silent --show-error --insecure \
              --output "${refresh_race_dir}/second-b.body" \
              --write-out '%{http_code}' \
              --request POST https://localhost/api/auth/refresh \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              >"${refresh_race_dir}/second-b.code" &
          second_b_pid=$!

          wait "${second_a_pid}"
          wait "${second_b_pid}"

          second_a_code="$(cat "${refresh_race_dir}/second-a.code")"
          second_b_code="$(cat "${refresh_race_dir}/second-b.code")"

          second_successes=0
          second_replays=0
          for code in "${second_a_code}" "${second_b_code}"; do
            case "${code}" in
              200) second_successes=$((second_successes + 1)) ;;
              401) second_replays=$((second_replays + 1)) ;;
              *) echo "Unexpected rotated refresh race status: ${code}" >&2; exit 1 ;;
            esac
          done
          test "${second_successes}" -eq 1
          test "${second_replays}" -eq 1

          if [ "${second_a_code}" = "200" ]; then
            second_refresh_json="$(cat "${refresh_race_dir}/second-a.body")"
          else
            second_refresh_json="$(cat "${refresh_race_dir}/second-b.body")"
          fi

          second_rotated_access_token="$(jq --exit-status --raw-output '.accessToken' <<<"${second_refresh_json}")"

          replay_first_rotated_code="$(
            printf '{"refreshToken":"%s"}' "${first_rotated_refresh_token}" |
              curl --silent --show-error --insecure \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST https://localhost/api/auth/refresh \
                --header 'Content-Type: application/json' \
                --data-binary @-
          )"
          test "${replay_first_rotated_code}" = "401"

          access_token="${second_rotated_access_token}"

          cleanup_refresh_race
          trap - EXIT
          unset refresh_race_dir refresh_token first_rotated_refresh_token
          unset first_refresh_json second_refresh_json second_rotated_access_token
          unset replay_original_code replay_first_rotated_code
          unset first_a_code first_b_code second_a_code second_b_code
          unset first_successes first_replays second_successes second_replays
          unset first_a_pid first_b_pid second_a_pid second_b_pid

          stream_json="$(curl --fail --silent --show-error --insecure \
            --request POST https://localhost/api/bill-streams \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data '{"providerName":"CI Recovery Provider","category":"Utility"}')"
          stream_id="$(jq --exit-status --raw-output '.id' <<<"${stream_json}")"
          printf '%%PDF-1.4\n%% CI recovery fixture\n%%%%EOF\n' > /tmp/billwatch-recovery-fixture.pdf
          curl --fail --silent --show-error --insecure \
            --request POST "https://localhost/api/bill-streams/${stream_id}/statement-uploads" \
            --header "Authorization: Bearer ${access_token}" \
            --form 'file=@/tmp/billwatch-recovery-fixture.pdf;type=application/pdf' \
            >/dev/null
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/keys -type f -name "key-*.xml" -size +0c -print -quit)"'
          docker compose --file compose.production.yml exec --no-TTY api sh -c \
            'test -n "$(find /var/lib/billwatch/statements -type f -size +0c -print -quit)"'

      - name: Build recovery image
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml build backup

      - name: Verify production image release revisions
        if: steps.container_changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            "billwatch-api:${BILLWATCH_RELEASE_ID}" \
            "billwatch-parser-worker:${BILLWATCH_RELEASE_ID}" \
            "billwatch-web:${BILLWATCH_RELEASE_ID}" \
            "billwatch-backup:${BILLWATCH_RELEASE_ID}"
          do
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}")"
            test "${revision}" = "${BILLWATCH_RELEASE_ID}"
          done

      - name: Initialize encrypted backup repository
        if: steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml run --rm backup init

      - name: Create consistent encrypted backup
        if: steps.container_changes.outputs.required == 'true'
        run: sh deploy/run-backup.sh "$PWD"

      - name: Prove isolated database and file restore
        if: steps.container_changes.outputs.required == 'true'
        run: |
          docker compose --profile operations --file compose.production.yml up --detach --wait restore-database
          docker compose --profile operations --file compose.production.yml run --rm backup verify
          docker compose --profile operations --file compose.production.yml stop restore-database

      - name: Verify API recovery after backup
        if: steps.container_changes.outputs.required == 'true'
        run: curl --fail --insecure --retry 30 --retry-all-errors --retry-delay 2 https://localhost/health/ready

      - name: Print sanitized container logs on failure
        if: failure() && steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml logs --no-color --tail 200

      - name: Stop production stack
        if: always() && steps.container_changes.outputs.required == 'true'
        run: docker compose --profile operations --file compose.production.yml down --volumes
