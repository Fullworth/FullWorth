name: FullWorth Branch Cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type cleanup-merged-branches to run the guarded cleanup
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fullworth-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete proven stale branches
    if: >-
      github.repository == 'Fullworth/FullWorth' &&
      github.actor == 'RealizmModz' &&
      inputs.confirmation == 'cleanup-merged-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete only proven stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          deleted=0
          skipped=0
          contained_deleted=0

          delete_branch_if_present()
          {
            local branch="$1"
            local expected_sha="$2"
            local open_heads open_bases current_sha

            # A branch can become a PR head/base after the initial listing.
            # Recheck both references and the exact enumerated head directly
            # before DELETE. The GitHub REST delete is not a transactional
            # compare-and-swap, so fail closed on any unverifiable state.
            if ! open_heads="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f head="$REPOSITORY_OWNER:$branch" \
                -f per_page=100 --jq 'length'
            )"; then
              echo "Failed to recheck open PR heads for $branch" >&2
              return 1
            fi

            if ! open_bases="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f base="$branch" \
                -f per_page=100 --jq 'length'
            )"; then
              echo "Failed to recheck open PR bases for $branch" >&2
              return 1
            fi

            if [[ "$open_heads" != "0" || "$open_bases" != "0" ]]; then
              echo "Keeping branch used by an open PR: $branch"
              return 2
            fi

            if ! current_sha="$(
              gh api -X GET "repos/$REPOSITORY/git/ref/heads/$branch" \
                --jq '.object.sha' 2>/dev/null
            )"; then
              echo "Keeping missing or unverifiable branch ref: $branch"
              return 2
            fi

            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "Keeping branch whose head changed: $branch"
              return 2
            fi

            if gh api -X DELETE \
              "repos/$REPOSITORY/git/refs/heads/$branch"
            then
              return 0
            fi

            # A prior serialized run or maintainer may have removed the ref
            # after enumeration. Accept the failed DELETE only after GitHub
            # confirms the branch is now absent.
            current_after="$(
              gh api --paginate \
                "repos/$REPOSITORY/branches?per_page=100" \
                --jq ".[] | select(.name == \"$branch\") | .name" |
                head -n 1
            )"

            if [[ -z "$current_after" ]]; then
              echo "Branch already absent after concurrent cleanup: $branch"
              return 0
            fi

            echo "Failed to delete branch that still exists: $branch" >&2
            return 1
          }

          while IFS=$'\t' read -r branch sha protected; do
            case "$branch" in
              master|development)
                continue
                ;;
            esac

            if [[ "$protected" == "true" ]]; then
              echo "Skipping protected branch: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            open_count="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f head="$REPOSITORY_OWNER:$branch" \
                -f per_page=100 \
                --jq 'length'
            )"

            open_base_count="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f base="$branch" \
                -f per_page=100 \
                --jq 'length'
            )"

            if [[ "$open_count" != "0" || "$open_base_count" != "0" ]]; then
              echo "Skipping branch used by an open PR: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            containment="$(
              gh api -X GET \
                "repos/$REPOSITORY/compare/$sha...development" \
                --jq '[.status, .behind_by] | @tsv'
            )"

            IFS=$'\t' read -r containment_status containment_behind <<< "$containment"

            if [[ "$containment_behind" == "0" ]] &&
              { [[ "$containment_status" == "ahead" ]] ||
                [[ "$containment_status" == "identical" ]]; }
            then
              if delete_branch_if_present "$branch" "$sha"; then
                echo "Deleted branch fully contained in development: $branch"
                contained_deleted=$((contained_deleted + 1))
              else
                status=$?
                if [[ "$status" != "2" ]]; then exit "$status"; fi
                skipped=$((skipped + 1))
              fi
              continue
            fi

            merged_head_match="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=closed \
                -f head="$REPOSITORY_OWNER:$branch" \
                -f per_page=100 \
                --jq "[.[] | select(.head.sha == \"$sha\" and .merged_at != null)] | length"
            )"

            if [[ "$merged_head_match" == "0" ]]; then
              echo "Keeping branch without a merged PR at its current head: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            if delete_branch_if_present "$branch" "$sha"; then
              echo "Deleted merged-PR source branch: $branch"
              deleted=$((deleted + 1))
            else
              status=$?
              if [[ "$status" != "2" ]]; then exit "$status"; fi
              skipped=$((skipped + 1))
            fi
          done < <(
            gh api --paginate \
              "repos/$REPOSITORY/branches?per_page=100" \
              --jq '.[] | [.name, .commit.sha, .protected] | @tsv'
          )

          {
            echo "## FullWorth branch cleanup"
            echo
            echo "- Deleted branches fully contained in development: $contained_deleted"
            echo "- Deleted merged-PR source branches: $deleted"
            echo "- Preserved branches without a matching merged PR: $skipped"
            echo "- Always preserved: master, development, protected branches, active PR heads/bases, changing refs, and branches without verified merge/containment evidence"
          } >> "$GITHUB_STEP_SUMMARY"
