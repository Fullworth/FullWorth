name: FullWorth Branch Cleanup

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fullworth-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete proven stale branches
    if: >-
      github.event.issue.number == 245 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/cleanup-merged-branches' &&
      github.repository == 'Fullworth/FullWorth' &&
      github.actor == 'RealizmModz'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete only proven stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          deleted=0
          skipped=0
          contained_deleted=0

          delete_branch_if_present()
          {
            local branch="$1"

            if gh api -X DELETE \
              "repos/$REPOSITORY/git/refs/heads/$branch"
            then
              return 0
            fi

            # A run that started before serialization was added may have
            # deleted this ref after enumeration. Accept the failed DELETE
            # only after the repository confirms the branch is now absent.
            current_after="$(
              gh api --paginate \
                "repos/$REPOSITORY/branches?per_page=100" \
                --jq ".[] | select(.name == \"$branch\") | .name" |
                head -n 1
            )"

            if [[ -z "$current_after" ]]; then
              echo "Branch already absent after concurrent cleanup: $branch"
              return 0
            fi

            echo "Failed to delete branch that still exists: $branch" >&2
            return 1
          }

          while IFS=$'\t' read -r branch sha protected; do
            case "$branch" in
              master|development)
                continue
                ;;
            esac

            if [[ "$protected" == "true" ]]; then
              echo "Skipping protected branch: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            open_count="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=open \
                -f head="$REPOSITORY_OWNER:$branch" \
                -f per_page=100 \
                --jq 'length'
            )"

            if [[ "$open_count" != "0" ]]; then
              echo "Skipping branch with open PR: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            containment="$(
              gh api -X GET \
                "repos/$REPOSITORY/compare/$sha...development" \
                --jq '[.status, .behind_by] | @tsv'
            )"

            IFS=$'\t' read -r containment_status containment_behind <<< "$containment"

            if [[ "$containment_behind" == "0" ]] &&
              { [[ "$containment_status" == "ahead" ]] ||
                [[ "$containment_status" == "identical" ]]; }
            then
              delete_branch_if_present "$branch"

              echo "Deleted branch fully contained in development: $branch"
              contained_deleted=$((contained_deleted + 1))
              continue
            fi

            merged_head_match="$(
              gh api -X GET "repos/$REPOSITORY/pulls" \
                -f state=closed \
                -f head="$REPOSITORY_OWNER:$branch" \
                -f per_page=100 \
                --jq "[.[] | select(.head.sha == \"$sha\" and .merged_at != null)] | length"
            )"

            if [[ "$merged_head_match" == "0" ]]; then
              echo "Keeping branch without a merged PR at its current head: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            delete_branch_if_present "$branch"

            echo "Deleted merged-PR source branch: $branch"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate \
              "repos/$REPOSITORY/branches?per_page=100" \
              --jq '.[] | [.name, .commit.sha, .protected] | @tsv'
          )

          {
            echo "## FullWorth branch cleanup"
            echo
            echo "- Deleted branches fully contained in development: $contained_deleted"
            echo "- Deleted merged-PR source branches: $deleted"
            echo "- Preserved branches without a matching merged PR: $skipped"
            echo "- Always preserved: master, development, protected branches, branches with open pull requests, and any branch with commits not contained in development"
          } >> "$GITHUB_STEP_SUMMARY"
