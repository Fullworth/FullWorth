name: billwatch

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 10m

services:
  api:
    image: billwatch-api:${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 256
    cpus: ${BILLWATCH_API_CPU_LIMIT:-2.0}
    mem_limit: ${BILLWATCH_API_MEMORY_LIMIT:-1g}
    memswap_limit: ${BILLWATCH_API_MEMORY_LIMIT:-1g}
    depends_on:
      database:
        condition: service_healthy
      parser-worker:
        # The worker enables domain controllers in its container cgroup, so
        # Docker health-exec processes must not be injected into that parent.
        # Guarded startup verifies readiness over the pinned internal TLS path.
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ParserWorker__BaseUrl: https://parser-worker:8081
      ParserWorker__AuthenticationToken: ${BILLWATCH_PARSER_AUTH_TOKEN:?Set BILLWATCH_PARSER_AUTH_TOKEN}
      ParserWorker__ServerCertificatePath: /var/run/fullworth-parser-tls/parser-worker.cer.pem
      AllowedHosts: ${BILLWATCH_HOST:?Set BILLWATCH_HOST}
      ConnectionStrings__BillWatchDatabase: Host=database;Port=5432;Database=billwatch;Username=billwatch;Password=${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
      Database__MigrateOnStartup: "true"
      Subscription__EnforcementEnabled: ${BILLWATCH_SUBSCRIPTION_ENFORCEMENT_ENABLED:-false}
      Subscription__EnforcementCohort: ${BILLWATCH_SUBSCRIPTION_ENFORCEMENT_COHORT:-All}
      StripeBilling__Enabled: ${BILLWATCH_STRIPE_ENABLED:-false}
      StripeBilling__SecretKey: ${STRIPE_SECRET_KEY:-}
      StripeBilling__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      StripeBilling__MonthlyPriceId: ${STRIPE_MONTHLY_PRICE_ID:-}
      StripeBilling__YearlyPriceId: ${STRIPE_YEARLY_PRICE_ID:-}
      StripeBilling__PublicWebBaseUrl: https://${BILLWATCH_WEB_HOST:?Set BILLWATCH_WEB_HOST}
      DataProtection__KeysPath: /var/lib/billwatch/keys
      BillStatementStorage__RootPath: /var/lib/billwatch/statements
      Plaid__ClientId: ${PLAID_CLIENT_ID:?Set PLAID_CLIENT_ID}
      Plaid__Secret: ${PLAID_SECRET:?Set PLAID_SECRET}
      Plaid__Environment: ${PLAID_ENVIRONMENT:?Set PLAID_ENVIRONMENT}
      ExternalIdentity__Google__Audience: ${FULLWORTH_GOOGLE_CLIENT_ID:-}
      ExternalIdentity__Apple__Audience: ${FULLWORTH_APPLE_CLIENT_ID:-}
      IdentityEmail__Enabled: ${BILLWATCH_IDENTITY_EMAIL_ENABLED:-false}
      IdentityEmail__ApiKey: ${RESEND_API_KEY:-}
      IdentityEmail__FromAddress: ${BILLWATCH_IDENTITY_EMAIL_FROM_ADDRESS:-security@billbeacon.net}
      IdentityEmail__FromName: ${BILLWATCH_IDENTITY_EMAIL_FROM_NAME:-FullWorth}
      IdentityEmail__PublicWebBaseUrl: https://${BILLWATCH_WEB_HOST:?Set BILLWATCH_WEB_HOST}
      ReverseProxy__KnownProxies__0: 172.30.0.10
      StatementAi__Local__Enabled: "false"
      StatementAi__Shadow__Enabled: "false"
      StatementAi__Shadow__AllowProviderCalls: "false"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1654,gid=1654,mode=0700
    volumes:
      - data_protection_keys:/var/lib/billwatch/keys
      - statement_files:/var/lib/billwatch/statements
      - parser_worker_tls:/var/run/fullworth-parser-tls:ro
    networks:
      - data
      - api_edge
      - web_api
      - api_egress
      - parser_worker

  parser-worker:
    image: billwatch-parser-worker:${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    build:
      context: .
      dockerfile: Dockerfile
      target: parser-worker-final
      args:
        BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    # Root exists only for the deterministic cgroup-v2 bootstrap. The entrypoint
    # immediately drops to UID/GID 1654 with an empty capability bounding set
    # before the HTTP worker starts.
    user: "0:0"
    cgroup: host
    read_only: true
    pids_limit: 64
    cpus: ${BILLWATCH_PARSER_CPU_LIMIT:-1.0}
    mem_limit: ${BILLWATCH_PARSER_MEMORY_LIMIT:-512m}
    memswap_limit: ${BILLWATCH_PARSER_MEMORY_LIMIT:-512m}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8081
      DOTNET_EnableDiagnostics: "0"
      ParserWorker__AuthenticationToken: ${BILLWATCH_PARSER_AUTH_TOKEN:?Set BILLWATCH_PARSER_AUTH_TOKEN}
      ParserWorker__TlsCertificatePath: /var/run/fullworth-parser-tls/parser-worker.cer.pem
      FULLWORTH_PARSER_DOCUMENT_CPU_QUOTA_US: "100000"
      FULLWORTH_PARSER_DOCUMENT_CPU_PERIOD_US: "100000"
      FULLWORTH_PARSER_DOCUMENT_MEMORY_MAX_BYTES: "402653184"
      FULLWORTH_PARSER_DOCUMENT_SWAP_MAX_BYTES: "0"
      FULLWORTH_PARSER_DOCUMENT_PIDS_MAX: "48"
      # Native OCR is entered only after its stricter sibling per-image cgroup is ready.
      FULLWORTH_PARSER_IMAGE_CPU_QUOTA_US: "100000"
      FULLWORTH_PARSER_IMAGE_CPU_PERIOD_US: "100000"
      FULLWORTH_PARSER_IMAGE_MEMORY_MAX_BYTES: "402653184"
      FULLWORTH_PARSER_IMAGE_SWAP_MAX_BYTES: "0"
      # Test-only host observation window; production defaults to no delay.
      FULLWORTH_PARSER_IMAGE_OBSERVATION_DELAY_MS: ${FULLWORTH_PARSER_IMAGE_OBSERVATION_DELAY_MS:-0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654,mode=0700
    volumes:
      - parser_worker_tls:/var/run/fullworth-parser-tls
      - type: bind
        source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        read_only: false
    networks:
      - parser_worker

  web:
    image: billwatch-web:${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 256
    cpus: ${BILLWATCH_WEB_CPU_LIMIT:-1.0}
    mem_limit: ${BILLWATCH_WEB_MEMORY_LIMIT:-512m}
    memswap_limit: ${BILLWATCH_WEB_MEMORY_LIMIT:-512m}
    depends_on:
      api:
        condition: service_healthy
      web-session-cache:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: ${BILLWATCH_WEB_HOST:?Set BILLWATCH_WEB_HOST}
      BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
      FullWorthApi__BaseUrl: http://api:8080
      FullWorthApi__HostHeader: ${BILLWATCH_HOST:?Set BILLWATCH_HOST}
      ExternalIdentity__Google__ClientId: ${FULLWORTH_GOOGLE_CLIENT_ID:-}
      ExternalIdentity__Google__ClientSecret: ${FULLWORTH_GOOGLE_CLIENT_SECRET:-}
      ExternalIdentity__Apple__ClientId: ${FULLWORTH_APPLE_CLIENT_ID:-}
      ExternalIdentity__Apple__ClientSecret: ${FULLWORTH_APPLE_CLIENT_SECRET:-}
      DataProtection__KeysPath: /var/lib/billwatch-web/keys
      WebSession__RedisHost: web-session-cache
      WebSession__RedisPassword: ${BILLWATCH_WEB_SESSION_REDIS_PASSWORD:?Set BILLWATCH_WEB_SESSION_REDIS_PASSWORD}
      ReverseProxy__KnownProxies__0: 172.31.0.10
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1654,gid=1654,mode=0700
    volumes:
      - web_data_protection_keys:/var/lib/billwatch-web/keys
    networks:
      - web_edge
      - web_api
      - web_session
      - web_egress

  web-session-cache:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    user: "999:1000"
    read_only: true
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${BILLWATCH_WEB_SESSION_REDIS_PASSWORD:?Set BILLWATCH_WEB_SESSION_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --save ''
        --appendonly no
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 128mb
        --maxmemory-policy volatile-ttl
        --dir /data
        --loglevel warning
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$REDIS_PASSWORD"
          redis-cli --no-auth-warning ping |
          grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=160m,uid=999,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=1000,mode=0700
    networks:
      - web_session

  database:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    environment:
      POSTGRES_DB: billwatch
      POSTGRES_USER: billwatch
      POSTGRES_PASSWORD: ${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      data:
        aliases:
          - database

  backup:
    profiles:
      - operations
    image: billwatch-backup:${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
      args:
        BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
    restart: "no"
    read_only: true
    user: "1654:1654"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGPASSWORD: ${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY: ${BILLWATCH_ALLOW_LOCAL_BACKUP_REPOSITORY:-false}
      BILLWATCH_RELEASE_ID: ${BILLWATCH_RELEASE_ID:?Set BILLWATCH_RELEASE_ID}
      BILLWATCH_REQUIRE_RECOVERY_FIXTURE: ${BILLWATCH_REQUIRE_RECOVERY_FIXTURE:-false}
      BILLWATCH_BACKUP_CLIENT_MODE: ${BILLWATCH_BACKUP_CLIENT_MODE:-append-only}
      BILLWATCH_BACKUP_RETENTION_ENABLED: ${BILLWATCH_BACKUP_RETENTION_ENABLED:-false}
      BILLWATCH_BACKUP_KEEP_DAILY: ${BILLWATCH_BACKUP_KEEP_DAILY:-14}
      BILLWATCH_BACKUP_KEEP_WEEKLY: ${BILLWATCH_BACKUP_KEEP_WEEKLY:-8}
      BILLWATCH_BACKUP_KEEP_MONTHLY: ${BILLWATCH_BACKUP_KEEP_MONTHLY:-12}
      BILLWATCH_BACKUP_KEEP_YEARLY: ${BILLWATCH_BACKUP_KEEP_YEARLY:-3}
      RESTORE_DATABASE_HOST: restore-database
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=${BILLWATCH_BACKUP_WORK_SIZE:-8g},uid=1654,gid=1654,mode=0700
    volumes:
      - backup_cache:/cache
      - backup_repository:/repository
      - data_protection_keys:/source/data-protection:ro
      - web_data_protection_keys:/source/web-data-protection:ro
      - statement_files:/source/statements:ro
    networks:
      - data
      - backup_egress
    logging: *default-logging

  restore-database:
    profiles:
      - operations
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: restore_host
      POSTGRES_USER: billwatch
      POSTGRES_PASSWORD: ${BILLWATCH_DATABASE_PASSWORD:?Set BILLWATCH_DATABASE_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$(stat -c %a "/var/lib/postgresql/data")" = 700 &&
          test "$(stat -c %u:%g "/var/lib/postgresql/data")" = "$(id -u postgres):$(id -g postgres)" &&
          pg_isready -U billwatch -d restore_host
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=${BILLWATCH_BACKUP_WORK_SIZE:-8g}
    networks:
      - data
    logging: *default-logging

  edge:
    image: caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      BILLWATCH_HOST: ${BILLWATCH_HOST:?Set BILLWATCH_HOST}
      BILLWATCH_WEB_HOST: ${BILLWATCH_WEB_HOST:?Set BILLWATCH_WEB_HOST}
      BILLWATCH_LEGACY_HOST: ${BILLWATCH_LEGACY_HOST:-legacy-api.localhost}
      BILLWATCH_LEGACY_WEB_HOST: ${BILLWATCH_LEGACY_WEB_HOST:-legacy-web.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge_egress:
      api_edge:
        ipv4_address: 172.30.0.10
      web_edge:
        ipv4_address: 172.31.0.10

networks:
  parser_worker:
    internal: true
  data:
    internal: true
  api_edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web_edge:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  web_api:
    internal: true
  web_session:
    internal: true
  api_egress:
  web_egress:
  backup_egress:
  edge_egress:

volumes:
  backup_cache:
  backup_repository:
  caddy_config:
  caddy_data:
  data_protection_keys:
  parser_worker_tls:
  postgres_data:
  statement_files:
  web_data_protection_keys:
